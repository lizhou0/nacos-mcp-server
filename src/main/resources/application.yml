server:
  port: 9000

spring:
  application:
    name: nacos-mcp-server
  ai:
    mcp:
      server:
        name: nacos-mcp-server
        version: 0.1.0
        # WebMVC starter 同一时刻只激活一种协议:SSE / STREAMABLE / STATELESS
        # SSE 自 2.0.0 起已废弃,推荐用 STREAMABLE
        protocol: ${MCP_PROTOCOL:STREAMABLE}

nacos:
  addr: ${NACOS_ADDR:127.0.0.1:8848}
  username: ${NACOS_USERNAME:nacos}
  password: ${NACOS_PASSWORD:nacos}
  namespace: ${NACOS_NAMESPACE:public}
  context-path: ${NACOS_CONTEXT_PATH:nacos}
  # AI transport mode: http 或 grpc
  ai-transport-mode: ${NACOS_AI_TRANSPORT_MODE:http}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.alibaba.nacos: WARN
    org.springframework.ai: INFO
    com.example.nacosmcp: INFO
